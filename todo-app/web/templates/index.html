<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Задачи</title>
</head>
<body>
    <h1>Мои задачи</h1>
    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Новая задача">
        <button type="submit">Добавить</button>
    </form>
    <ul>
        {{range .}}
        <li>
            {{if .Complete}}✅ {{end}}
            {{.Title}}
            {{if not .Complete}} <a href="/complete?id={{.ID}}">[выполнить]</a>{{end}}
            <a href="/delete?id={{.ID}}">[удалить]</a>
        </li>
        {{else}}
        <li>Нет задач</li>
        {{end}}
    </ul>
</body>
</html>
